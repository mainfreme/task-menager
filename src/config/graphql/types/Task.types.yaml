Task:
    type: object
    config:
        fields:
            id:
                type: "Int!"
            name:
                type: "String!"
            description:
                type: "String"
            status:
                type: "TaskStatus!"
            assignedUserId:
                type: "Int!"
            createdAt:
                type: "String!"
            updatedAt:
                type: "String!"
            events:
                type: "[TaskEvent!]!"
                resolve: "@=service('App\\\\UI\\\\GraphQL\\\\Resolver\\\\TaskEventResolver').findByTaskId(value['id'])"
